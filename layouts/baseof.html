<!doctype html>
<html lang="{{ site.Language.Locale }}">
	<head>
		{{ partial "head.html" . }}
	</head>

	<body>
		<a class="skip-link" href="#main-content">
			{{ i18n "skip_to_content" }}
		</a>

		<div class="site-shell">
			<header class="site-header">
				{{ partial "nav.html" . }}
			</header>

			<main id="main-content">
				{{ block "main" . }}{{ end }}
			</main>

			{{ partial "footer.html" . }}
		</div>
	</body>
</html>

baseURL = "https://riglegit.github.io/rewired/"
title = "Rewired"
theme = "rewired"
themesDir = "../.."

defaultContentLanguage = "es"
defaultContentLanguageInSubdir = false

[taxonomies]
  tag = "tags"
  category = "categories"

[pagination]
  pagerSize = 10

[params]
  blogPageSize = 5

[params.toc]
  enabled = true
  ordered = false
  startLevel = 1
  endLevel = 3

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[languages]

[languages.es]
  label = "Español"
  locale = "es-ES"
  weight = 1
  contentDir = "content/es"
  title = "Rewired"

[languages.es.params]
  author = "Rodrigo Iglesias"
  descriptionLines = [
    "Un tema oscuro, mínimo y con estética terminal.",
    "Pensado para blogs personales, proyectos y portfolios técnicos.",
  ]
  tagline = "Escribo en el [blog](/posts/), comparto [proyectos](/projects/) y mantengo una web personal sencilla."

[languages.es.params.footer]
  text = 'rewired // hecho con ♥ y [Hugo](https://gohugo.io/)'
  prompt = "user@rewired:~$"

[[languages.es.menus.main]]
  name = "home"
  pageRef = "/"
  weight = 10

[[languages.es.menus.main]]
  name = "blog"
  pageRef = "/posts"
  weight = 20

[[languages.es.menus.main]]
  name = "proyectos"
  pageRef = "/projects"
  weight = 30

[[languages.es.menus.main]]
  name = "about"
  pageRef = "/about"
  weight = 40

[[languages.es.params.social]]
  name = "GitHub"
  url = "https://github.com/RigleGit/rewired"
  icon = "fa-brands fa-github"

[[languages.es.params.social]]
  name = "Web"
  url = "https://rigle.dev"
  icon = "fa-solid fa-globe"

[[languages.es.params.subnodes]]
  name = "rigle.dev"
  url = "https://rigle.dev"
  description = "Web personal"

[[languages.es.params.subnodes]]
  name = "github.com/RigleGit"
  url = "https://github.com/RigleGit"
  description = "Código y proyectos"

[languages.en]
  label = "English"
  locale = "en-US"
  weight = 2
  contentDir = "content/en"
  title = "Rewired"

[languages.en.params]
  author = "Rodrigo Iglesias"
  descriptionLines = [
    "A dark, minimal, terminal-inspired Hugo theme.",
    "Built for personal blogs, projects, and technical portfolios.",
  ]
  tagline = "I write on the [blog](/en/posts/), share [projects](/en/projects/), and keep a simple personal website."

[languages.en.params.footer]
  text = 'rewired // made with ♥ and [Hugo](https://gohugo.io/)'
  prompt = "user@rewired:~$"

[[languages.en.menus.main]]
  name = "home"
  pageRef = "/"
  weight = 10

[[languages.en.menus.main]]
  name = "blog"
  pageRef = "/posts"
  weight = 20

[[languages.en.menus.main]]
  name = "projects"
  pageRef = "/projects"
  weight = 30

[[languages.en.menus.main]]
  name = "about"
  pageRef = "/about"
  weight = 40

[[languages.en.params.social]]
  name = "GitHub"
  url = "https://github.com/RigleGit/rewired"
  icon = "fa-brands fa-github"

[[languages.en.params.social]]
  name = "Website"
  url = "https://rigle.dev"
  icon = "fa-solid fa-globe"

[[languages.en.params.subnodes]]
  name = "rigle.dev"
  url = "https://rigle.dev"
  description = "Rodrigo's personal web"

[[languages.en.params.subnodes]]
  name = "github.com/RigleGit"
  url = "https://github.com/RigleGit"
  description = "Code and projects"

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]
